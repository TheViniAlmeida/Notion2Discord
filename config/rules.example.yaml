# Example configuration: "Demandas" board with 5 Discord channels.
# Copy to config/rules.yaml and adjust. NEVER put real URLs/secrets here:
# targets reference the NAME of an env var (values live in .env).

sources:
  demandas:
    database_id: "REPLACE_WITH_NOTION_DATABASE_ID"

targets:
  demandas-historico:
    type: discord
    webhook_env: DISCORD_WH_DEMANDAS_HISTORICO
  demandas-adicionadas:
    type: discord
    webhook_env: DISCORD_WH_DEMANDAS_ADICIONADAS
  demandas-emandamento:
    type: discord
    webhook_env: DISCORD_WH_DEMANDAS_EMANDAMENTO
  demandas-atualizadas:
    type: discord
    webhook_env: DISCORD_WH_DEMANDAS_ATUALIZADAS
  demandas-finalizadas:
    type: discord
    webhook_env: DISCORD_WH_DEMANDAS_FINALIZADAS
  demandas-comentarios:
    type: discord
    webhook_env: DISCORD_WH_DEMANDAS_COMENTARIOS
  # Phase 2 (n8n): uncomment and set N8N_WEBHOOK_DEMANDAS in .env
  # n8n-demandas:
  #   type: webhook
  #   url_env: N8N_WEBHOOK_DEMANDAS

# Notion e-mail -> Discord user id, used by `mention:` and {{mention.<Prop>}}.
# Personal data: fill it only in the host's config/rules.yaml (gitignored), never here.
# Discord id: User Settings > Advanced > Developer Mode, then right-click the user > Copy User ID.
# The integration needs "Read user information including email addresses" in Notion.
people:
  "ana@example.com": "100000000000000001"

# Shared look for every rule embed; a rule overrides any key (fields are replaced, not merged).
embed_defaults:
  thumbnail: { url: "https://example.com/logo.png" }
  image: { url: "https://example.com/line.gif" }
  footer: { text: "Quadro de Demandas • #{{prop.ID}}", icon_url: "https://example.com/logo.png" }

rules:
  - name: historico-tudo
    source: demandas
    on: [page.created, page.properties_updated, page.content_updated, page.deleted]
    send_to: [demandas-historico]
    embed:
      author: { name: "📜 {{event.label}}" }
      title: "{{page.title}}"
      url: "{{page.url}}"
      color: "#5865F2"
      fields:
        - { name: "📌 Status", value: "{{prop.Status}}", inline: true }
        - { name: "🚨 Prioridade", value: "{{prop.Prioridade}}", inline: true }
        - { name: "📅 Prazo", value: "{{prop.Prazo}}", inline: true }
        - { name: "👤 Atribuído", value: "{{mention.Atribuido}}", inline: true }
        - { name: "✍️ Criado por", value: "{{mention.Criado por}}", inline: true }

  - name: tarefa-adicionada
    source: demandas
    on: [page.created]
    send_to: [demandas-adicionadas]
    mention: [Atribuido]
    embed:
      author: { name: "🆕 Nova demanda" }
      title: "{{page.title}}"
      url: "{{page.url}}"
      color: "#FEE75C"
      fields:
        - { name: "🚨 Prioridade", value: "{{prop.Prioridade}}", inline: true }
        - { name: "💪 Esforço", value: "{{prop.Esforço necessário}}", inline: true }
        - { name: "📅 Prazo", value: "{{prop.Prazo}}", inline: true }
        - { name: "👤 Atribuído", value: "{{mention.Atribuido}}", inline: true }
        - { name: "✍️ Criado por", value: "{{mention.Criado por}}", inline: true }

  - name: tarefa-em-andamento
    source: demandas
    on: [page.properties_updated]
    when: { property: "Status", changed_to: "Em andamento" }
    send_to: [demandas-emandamento]
    mention: [Atribuido, "Criado por"]
    embed:
      author: { name: "▶️ Demanda em andamento" }
      title: "{{page.title}}"
      url: "{{page.url}}"
      color: "#EB459E"
      fields:
        - { name: "🔄 Status", value: "{{change.from}} → **{{change.to}}**", inline: true }
        - { name: "🚨 Prioridade", value: "{{prop.Prioridade}}", inline: true }
        - { name: "📅 Prazo", value: "{{prop.Prazo}}", inline: true }
        - { name: "👤 Atribuído", value: "{{mention.Atribuido}}", inline: true }
        - { name: "✍️ Criado por", value: "{{mention.Criado por}}", inline: true }

  - name: tarefa-atualizada
    source: demandas
    on: [page.properties_updated]
    send_to: [demandas-atualizadas]
    embed:
      author: { name: "✏️ Demanda atualizada" }
      title: "{{page.title}}"
      url: "{{page.url}}"
      color: "#5865F2"
      description: ">>> {{changes.summary}}"
      fields:
        - { name: "📌 Status", value: "{{prop.Status}}", inline: true }
        - { name: "👤 Atribuído", value: "{{mention.Atribuido}}", inline: true }

  - name: tarefa-finalizada
    source: demandas
    on: [page.properties_updated]
    when: { property: "Status", changed_to: "Concluido" }
    send_to: [demandas-finalizadas]
    mention: [Atribuido, "Criado por"]
    embed:
      author: { name: "✅ Demanda concluída" }
      title: "{{page.title}}"
      url: "{{page.url}}"
      color: "#57F287"
      fields:
        - { name: "🔄 Status", value: "{{change.from}} → **{{change.to}}**", inline: true }
        - { name: "🚨 Prioridade", value: "{{prop.Prioridade}}", inline: true }
        - { name: "👤 Atribuído", value: "{{mention.Atribuido}}", inline: true }
        - { name: "✍️ Criado por", value: "{{mention.Criado por}}", inline: true }

  # Needs "Read comments" on the Notion integration and comment.created in the subscription.
  - name: comentario
    source: demandas
    on: [comment.created]
    send_to: [demandas-comentarios]
    mention: [comment.mentions]
    embed:
      author: { name: "💬 Novo comentário" }
      title: "{{page.title}}"
      url: "{{page.url}}"
      color: "#99AAB5"
      description: ">>> {{comment.text}}"
      fields:
        - { name: "✍️ Autor", value: "{{mention.comment.author}}", inline: true }
        - { name: "👥 Mencionados", value: "{{mention.comment.mentions}}", inline: true }
